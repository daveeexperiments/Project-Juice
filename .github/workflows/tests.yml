name: tests

# `push` covers the two long-lived branches; `pull_request` covers everything else.
#
# The overlap has to be handled explicitly. With `push` on a branch AND `pull_request`, a push to
# a branch with an open PR fires both events and runs the suite twice, and the concurrency group
# below cannot collapse them: `github.ref` is refs/heads/<branch> for one and refs/pull/<n>/merge
# for the other, so they land in different groups. That is what the job's `if` is for.
on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless simulation tests
    # Skip the pull_request run when `push` already covers the head branch, so opening or updating
    # a development -> main PR does not run the suite a second time on the very same commits.
    # A PR from any other branch still runs, because `push` does not cover it.
    if: >-
      github.event_name != 'pull_request' ||
      !contains(fromJSON('["main", "development"]'), github.head_ref)
    runs-on: ubuntu-24.04
    env:
      # The port targets this build exactly. Float results can shift between engine versions, and
      # the prediction checks assert exact equality, so the version is pinned and verified.
      GODOT_VERSION: "4.7.2"
      # The suite must never report FEWER checks than this.
      #
      # This guard exists because of a real failure mode: a script that fails to compile ANYWHERE
      # in the project makes the tests that use it crash at runtime and disappear, while the
      # runner still prints "PASSED" and exits 0. Breaking core/cable.gd on purpose dropped the
      # count from 81 to 72 with a zero exit status. The exit code alone is not a gate.
      #
      # Raise this when you add checks. Never lower it to make a red build green.
      MIN_CHECKS: "81"

    steps:
      - uses: actions/checkout@v4

      - name: Cache the Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d /tmp/godot-unzip
          mkdir -p "$HOME/.cache/godot"
          mv "/tmp/godot-unzip/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.cache/godot/godot"
          chmod +x "$HOME/.cache/godot/godot"

      - name: Confirm the engine version
        # No apt packages are needed: this build links only against core glibc (libc, libdl,
        # libm, libpthread, librt) and statically links the rest, so there is no X11, fontconfig
        # or audio dependency to install even for the editor pass below.
        run: |
          set -euo pipefail
          "$HOME/.cache/godot/godot" --version
          "$HOME/.cache/godot/godot" --version | grep -q "^${GODOT_VERSION}\.stable\.official"

      - name: Register global class names
        # A `--script` run resolves `class_name` through .godot/global_script_class_cache.cfg,
        # which only the editor writes. On a fresh checkout there is no .godot, so without this
        # pass the suite dies on "Could not find base class" before running anything.
        #
        # It doubles as a whole-project compile check, and it has to be read rather than trusted:
        # this pass exits 0 even when scripts fail to parse.
        run: |
          set -uo pipefail
          log=/tmp/import.log
          "$HOME/.cache/godot/godot" --headless --editor --quit --path . 2>&1 | tee "$log"
          if grep -qE 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then
            echo "::error::A script failed to compile. Fix it before the tests can be trusted."
            exit 1
          fi

      - name: Run the headless suite
        run: |
          set -uo pipefail
          log=/tmp/tests.log
          "$HOME/.cache/godot/godot" --headless --path . --script tests/run_tests.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}

          # Guard 1: a runtime script error means checks were SKIPPED, not run.
          if grep -q 'SCRIPT ERROR' "$log"; then
            echo "::error::A runtime script error means checks were skipped rather than run."
            exit 1
          fi

          # Guard 2: the suite's own verdict.
          if [ "$status" -ne 0 ]; then
            echo "::error::The suite reported failures."
            exit "$status"
          fi

          # Guard 3: checks must not quietly go missing.
          count=$(sed -n 's/^PASSED  *\([0-9]\{1,\}\) checks.*/\1/p' "$log" | tail -1)
          if [ -z "$count" ]; then
            echo "::error::No PASSED line found: the suite did not finish."
            exit 1
          fi
          if [ "$count" -lt "$MIN_CHECKS" ]; then
            echo "::error::Only $count checks ran, expected at least ${MIN_CHECKS}. Tests have gone missing."
            exit 1
          fi
          echo "$count checks passed."
